name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Check lyrics parser
        run: |
          mkdir -p build
          swiftc Mochy/Core/Models/Track.swift Mochy/Core/Models/LyricLine.swift Mochy/Core/Services/Lyrics/LyricsManager.swift Tests/main.swift -o build/lyrics-check
          build/lyrics-check
      - name: Archive for iOS
        run: |
          set -o pipefail
          xcodebuild archive -project Mochy.xcodeproj -scheme Mochy -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/Mochy.xcarchive" CODE_SIGNING_ALLOWED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES | tee build/archive.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/Mochy.xcarchive/Products/Applications/MochyMusic.app
          mkdir -p build/package/Payload
          ditto build/Mochy.xcarchive/Products/Applications/MochyMusic.app build/package/Payload/MochyMusic.app
          cd build/package
          /usr/bin/zip -qry ../MochyMusic.ipa Payload
          /usr/bin/unzip -t ../MochyMusic.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MochyMusic-unsigned
          path: build/MochyMusic.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics
          path: build/archive.log
