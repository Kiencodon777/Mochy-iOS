name: Build Mochy iOS (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 / 16.0
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (Skip Code Signing)
        run: |
          xcodebuild -project Mochy.xcodeproj \
            -scheme Mochy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/Mochy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Mochy.xcarchive/Products/Applications/Mochy.app Payload/
          zip -r MochyMusic.ipa Payload
          echo "IPA packaging completed. File size:"
          ls -lh MochyMusic.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochyMusic-Unsigned-IPA
          path: MochyMusic.ipa
          retention-days: 7
